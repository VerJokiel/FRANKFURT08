name: Update DAX market data

# Backup for data/dax40.js (closes, market caps, ECB rates). The session job in live-dax40.yml
# normally commits it at ~18:05 Frankfurt and refreshes it again before the next open; these runs
# catch anything that job missed. GitHub starts scheduled runs late or skips them, hence several times.
# A run that finds nothing new commits nothing, and build_dax40.py never replaces newer data with older.
on:
  schedule:
    - cron: "20 18 * * 1-5"    # 19:20 CET / 20:20 CEST
    - cron: "40 20 * * 1-5"    # 21:40 CET / 22:40 CEST
    - cron: "10 4 * * 2-6"     # next morning 05:10 CET / 06:10 CEST
    - cron: "35 11 * * 1-5"    # midday: picks up the ECB yield curve, published around noon
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - python/build_dax40.py
      - .github/workflows/update-dax40.yml

permissions:
  contents: write

concurrency:
  group: update-dax40
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install dependencies
        run: pip install -r python/requirements.txt

      - name: Fetch prices, market caps and ECB rates
        run: python python/build_dax40.py --period 2y

      - name: Commit if the data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/dax40.js data/dax40_prices.csv
          if git diff --cached --quiet; then
            echo "No change in data."
          else
            git commit -m "Update DAX market data ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main
            git push
          fi
