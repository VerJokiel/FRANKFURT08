name: Live DAX bars

# One long-running job per Xetra session publishes 5-minute bars for the DAX and its 40 members
# to the `live-data` branch (python/live_loop.py keeps its own 5-minute clock; dax.html polls the
# file every 30 seconds). GitHub starts scheduled runs late or skips them, so the schedule below is
# only a set of redundant morning kick-offs: the first one that fires waits for the 09:00 open and
# runs the session; later ones queue behind it (concurrency) and exit when they find nothing to do.
# Before the 6-hour job limit the job starts a fresh run of itself. After the close it commits the
# official daily closes (update-dax40.yml stays as a backup).
# 05:30-08:45 UTC covers 06:30-09:45 Frankfurt in winter and 07:30-10:45 in summer.
on:
  schedule:
    - cron: "30,45 5 * * 1-5"
    - cron: "0,15,30,45 6-7 * * 1-5"
    - cron: "15,45 8-14 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - python/build_live.py
      - python/live_loop.py
      - .github/workflows/live-dax40.yml

permissions:
  contents: write
  actions: write   # lets the job start its own follow-up run

concurrency:
  group: live-dax40
  cancel-in-progress: false

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install dependencies
        run: pip install -r python/requirements.txt

      - name: Publish bars through the session
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python python/live_loop.py
