name: Live DAX bars

# Publishes 5-minute bars for the DAX and its 40 members to the `live-data` branch,
# every 5 minutes during Xetra hours. dax.html polls that file every 30 seconds.
# 07:00-16:55 UTC covers 09:00-17:30 Frankfurt time in both winter (CET) and summer (CEST),
# plus Yahoo's ~15-minute delay on the last bars. GitHub may start scheduled runs late under load.
on:
  schedule:
    - cron: "*/5 7-16 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - python/build_live.py
      - .github/workflows/live-dax40.yml

permissions:
  contents: write

concurrency:
  group: live-dax40
  cancel-in-progress: true

jobs:
  bars:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install dependencies
        run: pip install -r python/requirements.txt

      - name: Get the last published file
        run: git fetch --depth 1 origin live-data && git show origin/live-data:live.json > old.json || echo "no live-data branch yet"

      - name: Fetch 5-minute bars
        id: build
        run: python python/build_live.py --out live.json --previous old.json

      - name: Publish to the live-data branch
        if: steps.build.outputs.changed == 'true'
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir publish && cp live.json publish/ && cd publish
          printf '# live-data\n\nGenerated by .github/workflows/live-dax40.yml every 5 minutes during Xetra hours. Do not edit; each run replaces this branch.\n' > README.md
          git init -q -b live-data
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add live.json README.md
          git commit -q -m "Live DAX bars $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" live-data
