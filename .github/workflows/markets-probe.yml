name: Markets probe (temporary)
on:
  push:
    branches: [markets-pages]
    paths: [python/build_market.py, python/build_market_live.py, python/markets.py, .github/workflows/markets-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: python/requirements.txt }
      - run: pip install -r python/requirements.txt
      - name: Daily data, all markets
        run: python python/build_market.py all
      - name: One live fetch per market
        run: |
          mkdir -p probe-live
          for m in cac40 ibex35 ftsemib wig20 ftse100; do python python/build_market_live.py $m --out probe-live/$m.json || true; done
      - name: Commit results to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/markets probe-live
          git commit -m "Probe: market data" && git pull --rebase origin markets-pages && git push origin HEAD:markets-pages || echo nothing
