name: Markets probe (temporary)
on:
  push:
    branches: [markets-pages]
    paths: [python/markets_probe.py, python/markets.py, .github/workflows/markets-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: python/requirements.txt }
      - run: pip install -r python/requirements.txt
      - run: python python/markets_probe.py
